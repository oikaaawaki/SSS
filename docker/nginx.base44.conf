# Static preview server for the repo's extensionless HTML entry files.
#
# "/" serves "SS" (the current revision); "S" (the previous revision) stays
# reachable at /S.
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index SS;
    charset utf-8;

    # Real files keep the MIME type nginx infers from their extension.
    location / {
        try_files $uri $uri/ /SS;
    }

    # "SS" and "S" have no file extension, so nginx cannot infer a MIME type for
    # them. Force HTML, otherwise the browser downloads the page instead of
    # rendering it.
    location = /SS { default_type text/html; }
    location = /S  { default_type text/html; }

    # Always re-read the file from disk so edits appear on reload.
    add_header Cache-Control "no-store";
}
