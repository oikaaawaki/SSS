# Static preview server for the repo's single HTML entry file ("S").
server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index S;

    # "S" has no file extension, so nginx cannot infer a MIME type from it.
    # Force HTML, otherwise the browser would download the page instead of
    # rendering it.
    default_type text/html;
    charset utf-8;

    location / {
        try_files $uri $uri/ /S;
    }

    # Always re-read the file from disk so edits appear on reload.
    add_header Cache-Control "no-store";
}
